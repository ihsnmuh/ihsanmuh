name: Build App

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['master']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Create .env file
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
        run: printf '%s\n' "$ENV_PROD" > .env

      - name: Check code formatting
        run: yarn format:check

      - name: Lint code
        run: yarn lint

      - name: Type check
        run: yarn typecheck

      - name: Run tests
        run: yarn test --run

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file for build
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
        run: printf '%s\n' "$ENV_PROD" > .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ihsanmuh-web
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Generate env hash for cache busting
        id: env-hash
        run: echo "hash=$(sha256sum .env | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CACHE_BUST=${{ steps.env-hash.outputs.hash }}
