name: Deploy App

on:
  workflow_run:
    workflows: ['Build App']
    types:
      - completed
    branches: ['master']

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}

    steps:
      - name: Deploy using SSH
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e

            echo "Starting deployment..."

            cd ~/apps/fe/ihsanmuh/ || { echo "Directory not found!"; exit 1; }

            echo "Pulling latest Docker image..."
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker compose pull || { docker logout; echo "Failed to pull image!"; exit 1; }
            docker logout

            echo "Running database migrations..."
            docker compose run --rm app node node_modules/prisma/build/index.js migrate deploy || { echo "Migration failed!"; exit 1; }

            echo "Running database seed..."
            docker compose run --rm app node node_modules/prisma/build/index.js db seed || { echo "Seed failed!"; exit 1; }

            echo "Starting application..."
            docker compose up -d --remove-orphans || { echo "Failed to start container!"; exit 1; }

            echo "Waiting for health check..."
            CONTAINER_ID=$(docker compose ps -q app)
            STATUS="starting"
            for _ in $(seq 1 30); do
              STATUS=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER_ID")
              [ "$STATUS" = "healthy" ] && break
              [ "$STATUS" = "unhealthy" ] && break
              sleep 5
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "Container is not healthy (status: $STATUS)"
              docker compose logs --tail=50 app
              exit 1
            fi
            echo "Container is healthy!"

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deployment completed successfully."
